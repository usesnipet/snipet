
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snipet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snipet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: snipet/snipet-go:0.0.2
    ports:
      - "8080:8080"
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_URL: postgres://postgres:postgres@postgres:5432/snipet?sslmode=disable
      DB_AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
