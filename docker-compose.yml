services:
  app:
    image: snipet/snipet:0.2.1
    ports:
      - "8852:8852"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/snipet
      PLUGINS_DIR: "/app/plugins"
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8852/system/health || exit 1"]
      interval: 5s
      retries: 10
      timeout: 5s
    volumes:
      - ./plugins:/app/plugins

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snipet
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db: