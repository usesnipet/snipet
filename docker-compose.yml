services:
  app:
    image: snipet/snipet:0.5.0
    ports:
      - "8852:8852"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/snipet
      PLUGINS_DIR: "/app/plugins"
      CORS_ORIGINS: "*"
      ROOT_PASSWORD: ${ROOT_PASSWORD:-admin}
    # host.docker.internal is the host, for a local Ollama or LM Studio; Linux needs it declared.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      # The image has no curl.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8852/api/system/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 10
      timeout: 5s
    volumes:
      - ./plugins:/app/plugins

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snipet
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db: