services:
  app:
    image: snipet/snipet:0.2.1
    ports:
      - "8852:8852"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/snipet
      PLUGINS_DIR: "/app/plugins"
    # host.docker.internal is the host, for a local Ollama or LM Studio; Linux needs it declared.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8852/system/health || exit 1"]
      interval: 5s
      retries: 10
      timeout: 5s
    volumes:
      - ./plugins:/app/plugins

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snipet
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console Web
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=admin
    restart: unless-stopped

volumes:
  db: