<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snipet widget — dev host page</title>
  </head>
  <body>
    <h1>Host page</h1>
    <p>Pretend this is a customer's site. The widget mounts in the bottom-right corner.</p>
    <p>
      <button onclick="SnipetWidget.toggle()">Toggle</button>
      <button onclick="SnipetWidget.configure({ theme: 'dark' })">Dark</button>
      <button onclick="SnipetWidget.configure({ theme: 'light' })">Light</button>
      <button onclick="SnipetWidget.disable()">Disable</button>
      <button onclick="SnipetWidget.enable()">Enable</button>
      <button onclick="SnipetWidget.destroy()">Destroy</button>
      <button onclick="SnipetWidget.init({ apiUrl: 'http://localhost:8852' })">Init</button>
    </p>
    <form id="auth" style="margin-top: 20px;">
      <input name="appId" placeholder="App id" size="36" />
      <input name="token" placeholder="App token" size="40" />
      <input name="agentId" placeholder="Agent id" size="36" />
      <button type="submit">Apply</button>
    </form>
    <script type="module" src="/src/main.tsx"></script>
    <!-- After the widget (module scripts run in order), so SnipetWidget exists. -->
    <script type="module">
      SnipetWidget.init({ apiUrl: "http://localhost:8852", theme: "auto", size: "lg", radius: 16 });
      for (const event of ["open", "close", "message", "error"]) {
        SnipetWidget.on(event, (payload) => console.log("[snipet]", event, payload));
      }

      const TOKEN_KEY = "@snipet/access-token";
      const APP_ID_KEY = "@snipet/app-id";
      const AGENT_KEY = "@snipet/agent-id";
      const form = document.getElementById("auth");
      form.token.value = localStorage.getItem(TOKEN_KEY) ?? "";
      form.appId.value = localStorage.getItem(APP_ID_KEY) ?? "";
      form.agentId.value = localStorage.getItem(AGENT_KEY) ?? "";
      const apply = () => {
        SnipetWidget.configure({
          token: form.token.value.trim() || undefined,
          appId: form.appId.value.trim() || undefined,
          agentId: form.agentId.value.trim() || undefined
        });
      }
      apply();
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        localStorage.setItem(TOKEN_KEY, form.token.value.trim());
        localStorage.setItem(APP_ID_KEY, form.appId.value.trim());
        localStorage.setItem(AGENT_KEY, form.agentId.value.trim());
        apply();
      });
    </script>
  </body>
</html>
