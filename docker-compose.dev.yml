services:
  app:
    build: .
    image: snipet-agent
    ports:
      - "8852:8852"
    env_file: .env
    environment:
      PORT: 8852
      DATABASE_URL: postgresql://postgres:postgres@db:5432/snipet
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snipet
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Local S3-compatible storage (STORAGE_DRIVER=s3), for development.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio:/data
    profiles: [dev]

volumes:
  db:
  minio:
