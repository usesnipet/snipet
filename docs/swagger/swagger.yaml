basePath: /api
definitions:
  APIKey:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      key_id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  APIKeyResponse:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      key_id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  APIKeyWithSecret:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      key:
        type: string
      key_id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  APIKeysPage:
    properties:
      data:
        items:
          $ref: '#/definitions/APIKey'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
  Auth:
    properties:
      data:
        $ref: '#/definitions/JSONMap'
      type:
        $ref: '#/definitions/AuthType'
    type: object
  AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/User'
    type: object
  AuthType:
    enum:
    - no-auth
    - static
    type: string
    x-enum-varnames:
    - AuthTypeNone
    - AuthTypeStatic
  Capability:
    enum:
    - text
    - vision
    - tools
    - streaming
    - embedding
    type: string
    x-enum-comments:
      CapabilityEmbedding: embedding text
      CapabilityStreaming: supports Provider.Stream
      CapabilityText: text output
      CapabilityTools: tool / function calling
      CapabilityVision: accepts image input
    x-enum-descriptions:
    - text output
    - accepts image input
    - tool / function calling
    - supports Provider.Stream
    - embedding text
    x-enum-varnames:
    - CapabilityText
    - CapabilityVision
    - CapabilityTools
    - CapabilityStreaming
    - CapabilityEmbedding
  ChangeOwnPasswordDTO:
    properties:
      current_password:
        type: string
      new_password:
        maxLength: 255
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  CreateAPIKeyDTO:
    properties:
      expires_at:
        type: string
      name:
        maxLength: 255
        type: string
    required:
    - name
    type: object
  CreateLlmConnectionDTO:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      default:
        type: boolean
      enabled:
        type: boolean
      name:
        maxLength: 255
        type: string
      provider:
        maxLength: 255
        type: string
    required:
    - config
    - name
    - provider
    type: object
  CreateMcpServerDTO:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      name:
        maxLength: 255
        type: string
      transport:
        allOf:
        - $ref: '#/definitions/Transport'
        enum:
        - http
        - stdio
    required:
    - config
    - name
    - transport
    type: object
  CreateUserDTO:
    properties:
      name:
        maxLength: 255
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
      role:
        type: string
      username:
        maxLength: 255
        type: string
    required:
    - name
    - password
    - role
    - username
    type: object
  Error:
    properties:
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
      statusCode:
        type: integer
    type: object
  ExecuteLlmDTO:
    properties:
      messages:
        items:
          $ref: '#/definitions/Message'
        minItems: 1
        type: array
      targets:
        items:
          $ref: '#/definitions/ExecuteLlmTargetDTO'
        minItems: 1
        type: array
    required:
    - messages
    - targets
    type: object
  ExecuteLlmResponse:
    properties:
      finish_reason:
        $ref: '#/definitions/FinishReason'
      message:
        $ref: '#/definitions/Message'
      usage:
        $ref: '#/definitions/Usage'
    type: object
  ExecuteLlmTargetDTO:
    properties:
      connection_id:
        type: string
      connection_options:
        $ref: '#/definitions/JSONMap'
      extra_options:
        $ref: '#/definitions/JSONMap'
      model:
        type: string
    required:
    - model
    type: object
  FinishReason:
    enum:
    - stop
    - length
    - tool_call
    type: string
    x-enum-comments:
      FinishLength: hit the output token cap
      FinishStop: natural end of the reply
      FinishToolCall: stopped to call a tool
    x-enum-descriptions:
    - natural end of the reply
    - hit the output token cap
    - stopped to call a tool
    x-enum-varnames:
    - FinishStop
    - FinishLength
    - FinishToolCall
  InfoDTO:
    properties:
      version:
        type: string
    type: object
  JSONMap:
    additionalProperties: {}
    type: object
  LLMConnectionResponse:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      created_at:
        type: string
      default:
        description: |-
          Default marks the connection the runner should use for its provider
          when a call doesn't name a specific connection. At most one connection
          per provider should have this set; the service layer enforces it.
        type: boolean
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      provider:
        type: string
      updated_at:
        type: string
    type: object
  LLMConnectionsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/LlmConnection'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
  LLMProviderRegistry:
    properties:
      auth:
        items:
          $ref: '#/definitions/Auth'
        type: array
      description:
        type: string
      icon:
        type: string
      key:
        type: string
      name:
        type: string
      schemas:
        $ref: '#/definitions/Schemas'
      tags:
        items:
          type: string
        type: array
    type: object
  LlmConnection:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      created_at:
        type: string
      default:
        description: |-
          Default marks the connection the runner should use for its provider
          when a call doesn't name a specific connection. At most one connection
          per provider should have this set; the service layer enforces it.
        type: boolean
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      provider:
        type: string
      updated_at:
        type: string
    type: object
  LoginDTO:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  McpServer:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      created_at:
        type: string
      id:
        type: string
      last_synced_at:
        type: string
      last_synced_error:
        type: string
      name:
        type: string
      transport:
        $ref: '#/definitions/Transport'
      updated_at:
        type: string
    type: object
  McpServerRegistryItem:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/JSONMap'
        description: |-
          Config is the default config for the server, shaped per Transport
          (see model.McpServer.Config).
      description:
        type: string
      icon:
        type: string
      key:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      transport:
        allOf:
        - $ref: '#/definitions/Transport'
        enum:
        - http
        - stdio
    required:
    - config
    - description
    - icon
    - key
    - name
    - tags
    - transport
    type: object
  McpServerResponse:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      created_at:
        type: string
      id:
        type: string
      last_synced_at:
        type: string
      last_synced_error:
        type: string
      name:
        type: string
      transport:
        $ref: '#/definitions/Transport'
      updated_at:
        type: string
    type: object
  McpServersPage:
    properties:
      data:
        items:
          $ref: '#/definitions/McpServer'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
  MeResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  Message:
    properties:
      parts:
        items: {}
        type: array
      role:
        $ref: '#/definitions/Role'
    type: object
  ProviderModel:
    properties:
      capabilities:
        items:
          $ref: '#/definitions/Capability'
        type: array
      context_window:
        description: ContextWindow is the maximum input size in tokens; 0 means unspecified.
        type: integer
      description:
        type: string
      key:
        description: Unique identifier for model (eg. gpt-4o)
        type: string
      max_output_tokens:
        description: MaxOutputTokens caps the generated tokens; 0 means unspecified.
        type: integer
      name:
        type: string
    type: object
  RefreshTokenDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  Role:
    enum:
    - system
    - user
    - assistant
    - tool
    type: string
    x-enum-varnames:
    - RoleSystem
    - RoleUser
    - RoleAssistant
    - RoleTool
  Schemas:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/JSONMap'
        description: |-
          Config validates the "config" section of the connection options — the
          always-required provider config (endpoint, region, org id, ...).
      generate_extra_options:
        allOf:
        - $ref: '#/definitions/JSONMap'
        description: |-
          GenerateExtraOptions validate the per-call
          extra_options of Generate and Stream.
    type: object
  Source:
    enum:
    - mcp
    - native
    type: string
    x-enum-varnames:
    - SourceMcp
    - SourceNative
  Tool:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      input_schema:
        $ref: '#/definitions/JSONMap'
      mcp_server:
        $ref: '#/definitions/McpServer'
      mcp_server_id:
        type: string
      name:
        type: string
      source:
        $ref: '#/definitions/Source'
      updated_at:
        type: string
    type: object
  ToolResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      input_schema:
        $ref: '#/definitions/JSONMap'
      mcp_server:
        $ref: '#/definitions/McpServer'
      mcp_server_id:
        type: string
      name:
        type: string
      source:
        $ref: '#/definitions/Source'
      updated_at:
        type: string
    type: object
  ToolsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/Tool'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
  Transport:
    enum:
    - http
    - stdio
    type: string
    x-enum-varnames:
    - TransportHTTP
    - TransportStdIO
  UpdateExpirationDTO:
    properties:
      expires_at:
        type: string
    type: object
  UpdateLlmConnectionDTO:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      default:
        type: boolean
      enabled:
        type: boolean
      name:
        maxLength: 255
        type: string
      provider:
        maxLength: 255
        type: string
    type: object
  UpdateMcpServerDTO:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      name:
        maxLength: 255
        type: string
      transport:
        allOf:
        - $ref: '#/definitions/Transport'
        enum:
        - http
        - stdio
    type: object
  UpdateUserDTO:
    properties:
      name:
        maxLength: 255
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
      role:
        type: string
    type: object
  Usage:
    properties:
      input_tokens:
        type: integer
      output_tokens:
        type: integer
    type: object
  User:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  UserResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  UsersPage:
    properties:
      data:
        items:
          $ref: '#/definitions/User'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: API for the snipets platform.
  title: snipets API
  version: "1.0"
paths:
  /api-key/me:
    get:
      description: Returns the API key used to authenticate the current request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKeyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Get current API key
      tags:
      - api-key
  /api-keys:
    get:
      description: Lists API keys, with optional pagination.
      parameters:
      - description: Page size
        in: query
        name: take
        type: integer
      - description: Page offset
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKeysPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: List API keys
      tags:
      - api-key
    post:
      consumes:
      - application/json
      description: Creates a new API key. The plaintext key is only returned once,
        on creation.
      parameters:
      - description: API key data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAPIKeyDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/APIKeyWithSecret'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: Create API key
      tags:
      - api-key
  /api-keys/{id}:
    delete:
      description: Deletes an API key by ID.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: Delete API key
      tags:
      - api-key
    get:
      description: Returns an API key by ID.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKeyResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: Get API key
      tags:
      - api-key
  /api-keys/{id}/active:
    put:
      description: Marks an API key as active.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: Activate API key
      tags:
      - api-key
  /api-keys/{id}/disabled:
    put:
      description: Marks an API key as disabled.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: Disable API key
      tags:
      - api-key
  /api-keys/{id}/expiration:
    put:
      consumes:
      - application/json
      description: Updates the expiration date of an API key.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      - description: Expiration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateExpirationDTO'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: Update API key expiration
      tags:
      - api-key
  /api-keys/{id}/roll:
    post:
      description: Rotates an API key, invalidating the previous secret. The new plaintext
        key is only returned once.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKeyWithSecret'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: Roll API key
      tags:
      - api-key
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the given refresh token. Idempotent.
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RefreshTokenDTO'
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Current user
      tags:
      - auth
  /auth/me/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ChangeOwnPasswordDTO'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Change own password
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RefreshTokenDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Refresh an access token
      tags:
      - auth
  /llm-connection:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LLMConnectionsPage'
      summary: List LlmConnections
      tags:
      - llm-connection
    post:
      consumes:
      - application/json
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateLlmConnectionDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/LLMConnectionResponse'
      summary: Create a LlmConnection
      tags:
      - llm-connection
  /llm-connection/{id}:
    delete:
      parameters:
      - description: LlmConnection ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a LlmConnection
      tags:
      - llm-connection
    get:
      parameters:
      - description: LlmConnection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LLMConnectionResponse'
      summary: Get a LlmConnection by ID
      tags:
      - llm-connection
    put:
      consumes:
      - application/json
      parameters:
      - description: LlmConnection ID
        in: path
        name: id
        required: true
        type: string
      - description: partial payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateLlmConnectionDTO'
      responses:
        "204":
          description: No Content
      summary: Update a LlmConnection
      tags:
      - llm-connection
  /llm-connection/execute:
    post:
      consumes:
      - application/json
      description: Runs the given targets in order (failover on the first that fails)
        against the given messages and returns the first successful response.
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ExecuteLlmDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ExecuteLlmResponse'
      summary: Execute an LLM
      tags:
      - llm-connection
  /llm-connection/execute/stream:
    post:
      consumes:
      - application/json
      description: Same as execute, but streams the response as Server-Sent Events
        ("llm_started", "text_delta", "tool_call", "llm_skipped", "message", "error",
        "done").
      parameters:
      - description: payload
        in: body
        name: body
