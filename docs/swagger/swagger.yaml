      duration_ms:
        type: integer
      id:
        type: integer
      input_tokens:
        type: integer
      model:
        description: Model, InputTokens and OutputTokens are set on assistant messages.
        type: string
      output_tokens:
        type: integer
      parts:
        items: {}
        type: array
      role:
        $ref: '#/definitions/Role'
      run_id:
        type: string
      session_id:
        type: string
      tool_id:
        description: ToolID and DurationMs are set on tool messages.
        type: string
    type: object
  AgentMessagesPage:
    properties:
      data:
        items:
          $ref: '#/definitions/AgentMessage'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
  AgentResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      llms:
        items:
          $ref: '#/definitions/AgentLLM'
        type: array
      max_turns:
        type: integer
      mcp_servers:
        items:
          $ref: '#/definitions/AgentMcpServer'
        type: array
      name:
        type: string
      system_prompt:
        type: string
      updated_at:
        type: string
    type: object
  AgentRun:
