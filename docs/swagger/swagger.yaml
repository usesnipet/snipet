info:
  contact: {}
  description: API for the snipets platform.
  title: snipets API
  version: "1.0"
paths:
  /agent:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AgentsPage'
      summary: List Agents
      tags:
      - agent
    post:
      consumes:
      - application/json
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAgentDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AgentResponse'
      summary: Create an Agent
      tags:
      - agent
  /agent-run:
    get:
      parameters:
      - description: Session ID
        in: query
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AgentRunsPage'
      summary: List the runs of a session
      tags:
      - agent-run
    post:
      consumes:
      - application/json
      description: Saves the input as a user message and runs the agent in the background.
        No session_id starts a new session.
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/StartRunDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/AgentRunResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Error'
      summary: Start an agent run
      tags:
      - agent-run
  /agent-run/{id}:
    get:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AgentRunResponse'
      summary: Get an agent run by ID
      tags:
      - agent-run
  /agent-run/{id}/cancel:
    post:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Cancel an agent run
      tags:
