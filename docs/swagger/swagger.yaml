      name:
        maxLength: 255
        type: string
      transport:
        allOf:
        - $ref: '#/definitions/Transport'
        enum:
        - http
        - stdio
    type: object
  UpdateUserDTO:
    properties:
      name:
        maxLength: 255
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
      role:
        type: string
    type: object
  Usage:
    properties:
      input_tokens:
        type: integer
      output_tokens:
        type: integer
    type: object
  User:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  UserResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  UsersPage:
    properties:
      data:
        items:
          $ref: '#/definitions/User'
        type: array
      skip:
