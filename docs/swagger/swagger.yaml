      created_at:
        type: string
      id:
        type: string
      subject:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  AgentSessionResponse:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      subject:
