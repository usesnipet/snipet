  AgentRunResponse:
    properties:
      created_at:
        type: string
      error:
        type: string
      finished_at:
        type: string
      id:
        type: string
      input_tokens:
        type: integer
      output_tokens:
        type: integer
      session_id:
        type: string
      started_at:
        type: string
      status:
        $ref: '#/definitions/AgentRunStatus'
