basePath: /api
definitions:
  ChangeOwnPasswordDTO:
    properties:
      current_password:
        type: string
      new_password:
        maxLength: 255
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  CreateLlmConnectionDTO:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      enabled:
        type: boolean
      name:
        maxLength: 255
        type: string
      provider:
        maxLength: 255
        type: string
    required:
    - config
    - name
    - provider
    type: object
  CreateUserDTO:
    properties:
      name:
        maxLength: 255
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
      role:
        type: string
      username:
        maxLength: 255
        type: string
    required:
    - name
    - password
    - role
    - username
    type: object
  Error:
    properties:
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
      statusCode:
        type: integer
    type: object
  InfoDTO:
    properties:
      version:
        type: string
    type: object
  JSONMap:
    additionalProperties: {}
    type: object
  LLMConnectionResponse:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      provider:
        type: string
      updated_at:
        type: string
    type: object
  LLMConnectionsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/LlmConnection'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
  LLMProviderRegistry:
    properties:
      configuration_schema:
        $ref: '#/definitions/JSONMap'
      description:
        type: string
      icon:
        type: string
      key:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
    required:
    - description
    - key
    - name
    type: object
  LlmConnection:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      provider:
        type: string
      updated_at:
        type: string
    type: object
  LoginDTO:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  LoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/User'
    type: object
  MeResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  Role:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
  UpdateLlmConnectionDTO:
    properties:
      config:
        $ref: '#/definitions/JSONMap'
      enabled:
        type: boolean
      name:
        maxLength: 255
        type: string
      provider:
        maxLength: 255
        type: string
    type: object
  UpdateUserDTO:
    properties:
      name:
        maxLength: 255
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
      role:
        type: string
    type: object
  User:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  UserResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        description: Name is the display name.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: Role is one of RoleAdmin | RoleUser.
      updated_at:
        type: string
      username:
        description: Username is the login handle — unique, case-sensitive.
        type: string
    type: object
  UsersPage:
    properties:
      data:
        items:
          $ref: '#/definitions/User'
        type: array
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: API for the snipets platform.
  title: snipets API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Current user
      tags:
      - auth
  /auth/me/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ChangeOwnPasswordDTO'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Change own password
      tags:
      - auth
  /llm-connection:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LLMConnectionsPage'
      summary: List LlmConnections
      tags:
      - llm-connection
    post:
      consumes:
      - application/json
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateLlmConnectionDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/LLMConnectionResponse'
      summary: Create a LlmConnection
      tags:
      - llm-connection
  /llm-connection/{id}:
    delete:
      parameters:
      - description: LlmConnection ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a LlmConnection
      tags:
      - llm-connection
    get:
      parameters:
      - description: LlmConnection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LLMConnectionResponse'
      summary: Get a LlmConnection by ID
      tags:
      - llm-connection
    put:
      consumes:
      - application/json
      parameters:
      - description: LlmConnection ID
        in: path
        name: id
        required: true
        type: string
      - description: partial payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateLlmConnectionDTO'
      responses:
        "204":
          description: No Content
      summary: Update a LlmConnection
      tags:
      - llm-connection
  /llm-connection/providers:
    get:
      description: Lists the available LLM providers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/LLMProviderRegistry'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: List LLM provider
      tags:
      - llm-connection
  /system/info:
    get:
      description: Returns application system information.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/InfoDTO'
      summary: Get system info
      tags:
      - system
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UsersPage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateUserDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Error'
      summary: Create a user
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      summary: Delete a user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      summary: Get a user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: partial payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateUserDTO'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      summary: Update a user
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
  BasicAuth:
    type: basic
swagger: "2.0"
